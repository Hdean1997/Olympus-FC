<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Olympus FC</title>

    <style>
        body {
            margin: 0;
            background: #07111f;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 48px;
            margin: 0;
        }

        .red {
            color: #e63946;
        }

        p {
            color: #aab6c5;
            font-size: 18px;
        }

        .button {
            margin-top: 20px;
            padding: 15px 28px;
            background: #1769ff;
            border-radius: 12px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="hero">
        <h1>OLYMPUS <span class="red">FC</span></h1>

        <p>Pro Clubs Stats Tracker</p>

        <div class="button">
            ENTER THE SUMMIT
        </div>
    </div>

</body>

</html>
